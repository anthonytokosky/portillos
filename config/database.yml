development:
  adapter: postgresql
  encoding: unicode
  database: portillos_development
  pool: 5

test:
  adapter: postgresql
  encoding: unicode
  database: portillos_test
  pool: 5

production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  url: <%= ENV['DATABASE_URL'] %>
